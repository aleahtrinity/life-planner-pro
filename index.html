<!DOCTYPE html>
<html lang="en" data-theme="blackwhite">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Planner Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== ROOT ===== */
:root {
  --font-heading: 'Playfair Display', serif;
  --font-body: 'Jost', sans-serif;
  --bg: #f7f7f7;
  --surface: #ffffff;
  --text: #1a1a1a;
  --text-muted: #888;
  --radius: 14px;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
  --border: #e8e8e8;
  --sidebar-w: 232px;
  --tr: 0.2s ease;
}

/* ===== THEMES ===== */
[data-theme="blackwhite"] { --accent:#1a1a1a; --accent-hover:#333; --accent-light:#f5f5f5; --accent-text:#fff; }
[data-theme="blush"]      { --accent:#c4768a; --accent-hover:#b0617a; --accent-light:#fdf0f3; --accent-text:#fff; }
[data-theme="blue"]       { --accent:#79A3C3; --accent-hover:#5f8faf; --accent-light:#eef4f9; --accent-text:#fff; }

/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:600}
input,textarea,select{font-family:var(--font-body)}
button{cursor:pointer}

/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:3px solid var(--accent);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform var(--tr);overflow-y:auto}
#main-content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
#app-content{flex:1;padding:28px 32px;max-width:1200px}

/* ===== SIDEBAR ===== */
.sidebar-logo{padding:22px 18px 14px;border-bottom:1px solid var(--border)}
.sidebar-logo h2{font-size:16px;line-height:1.3}
.sidebar-logo span{font-size:11px;color:var(--text-muted);font-family:var(--font-body);font-weight:400;letter-spacing:.5px}
.sidebar-nav{flex:1;padding:6px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;transition:background var(--tr),color var(--tr);font-size:13px;color:var(--text-muted);user-select:none;border-left:3px solid transparent}
.nav-item:hover{background:var(--accent-light);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
.nav-icon{width:18px;text-align:center;font-size:14px}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.sidebar-footer strong{display:block;color:var(--text);font-size:13px;margin-bottom:2px}

/* ===== TOP BAR (mobile) ===== */
#top-bar{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:90}
#hamburger{background:none;border:none;padding:4px;display:flex;flex-direction:column;gap:5px}
#hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px}
#top-bar-title{font-family:var(--font-heading);font-size:16px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}

/* ===== SAVE INDICATOR ===== */
#save-indicator{position:fixed;top:12px;right:20px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;z-index:9999;display:none;background:var(--accent);color:var(--accent-text)}

/* ===== AUTH ===== */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px;width:100%;max-width:400px}
.auth-card h1{font-size:26px;margin-bottom:6px}
.auth-subtitle{color:var(--text-muted);font-size:13px;margin-bottom:24px}
.auth-tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)}
.auth-tab-btn{flex:1;padding:10px;background:none;border:none;font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--tr)}
.auth-tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.auth-form-group{margin-bottom:14px}
.auth-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font-body);outline:none;transition:border-color var(--tr)}
.auth-input:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:12px;background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;font-family:var(--font-body);font-size:14px;font-weight:600;margin-top:6px;transition:background var(--tr)}
.auth-btn:hover{background:var(--accent-hover)}
#auth-error{color:#e74c3c;font-size:13px;margin-top:10px;display:none}
#auth-msg{color:var(--text-muted);font-size:13px;margin-top:10px;display:none}

/* ===== CARDS ===== */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;position:relative;overflow:hidden;margin-bottom:18px}
.card::before{content:'';position:absolute;top:0;left:0;right:0;pointer-events:none;border-radius:var(--radius) var(--radius) 0 0}
[data-theme="blackwhite"] .card::before{border-top:4px double #1a1a1a;height:8px}
[data-theme="blush"] .card::before{height:5px;background:linear-gradient(135deg,#EFCED7,#e8b5c0)}
[data-theme="blue"] .card::before{height:5px;background:linear-gradient(135deg,#79A3C3,#b0cede)}
.card-title{font-family:var(--font-heading);font-size:16px;margin-bottom:14px}
.card-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:12px}

/* ===== SECTION HEADER ===== */
.section-header{margin-bottom:24px}
.section-header h1{font-size:26px}
.section-header p{color:var(--text-muted);font-size:14px;margin-top:4px}

/* ===== GRIDS ===== */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-family:var(--font-body);font-size:13.5px;font-weight:500;transition:var(--tr);white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--accent-light);color:var(--accent);border:1.5px solid var(--accent)}
.btn-secondary:hover{background:var(--accent);color:var(--accent-text)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:#fee2e2;color:#dc2626;border:1.5px solid #fca5a5}
.btn-danger:hover{background:#dc2626;color:white}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:6px 8px;font-size:14px}

/* ===== FORMS ===== */
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.form-group{flex:1;min-width:120px;margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.input,.select,.textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font-body);font-size:13.5px;color:var(--text);background:white;outline:none;transition:border-color var(--tr)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
.textarea{resize:vertical;min-height:80px}

/* ===== TABS ===== */
.tab-bar{display:flex;gap:2px;margin-bottom:20px;border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:9px 16px;background:none;border:none;font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--tr);white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ===== TABLES ===== */
.table-wrap{overflow-x:auto;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;background:var(--bg);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* ===== PROGRESS ===== */
.progress-wrap{background:var(--bg);border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:100px;transition:width .4s ease}
.progress-green{background:#4ade80}
.progress-yellow{background:#fbbf24}
.progress-red{background:#f87171}
.progress-blue{background:#60a5fa}
.progress-purple{background:#c084fc}

/* ===== BADGES ===== */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.badge-gray{background:#f3f4f6;color:#374151}
.badge-pink{background:#fce7f3;color:#9d174d}
.badge-orange{background:#ffedd5;color:#9a3412}

/* ===== STAT CARDS ===== */
.stat-card{background:var(--surface);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;pointer-events:none;border-radius:var(--radius) var(--radius) 0 0}
[data-theme="blackwhite"] .stat-card::before{border-top:3px double #1a1a1a;height:6px}
[data-theme="blush"] .stat-card::before{height:3px;background:linear-gradient(135deg,#EFCED7,#e8b5c0)}
[data-theme="blue"] .stat-card::before{height:3px;background:linear-gradient(135deg,#79A3C3,#b0cede)}
.stat-value{font-family:var(--font-heading);font-size:28px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:4px}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}

/* ===== QUOTE BOX ===== */
.quote-box{text-align:center;padding:18px 22px;background:var(--accent-light);border-radius:var(--radius);border-left:4px solid var(--accent);margin-bottom:20px}
.quote-text{font-family:var(--font-heading);font-style:italic;font-size:15px;line-height:1.7;transition:opacity .5s}

/* ===== COVER PHOTO ===== */
.cover-section{position:relative;margin-bottom:20px;border-radius:var(--radius);overflow:hidden}
.cover-img{width:100%;height:180px;object-fit:cover;display:block}
.cover-placeholder{width:100%;height:160px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px dashed var(--accent);border-radius:var(--radius);color:var(--accent);font-size:13px;gap:8px}
.cover-edit-btn{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:white;border:none;padding:5px 11px;border-radius:6px;font-size:12px;font-family:var(--font-body)}

/* ===== HABIT ITEMS ===== */
.habit-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);margin-bottom:8px;background:white;transition:border-color var(--tr)}
.habit-item:hover{border-color:var(--accent)}
.habit-item.completed{background:var(--accent-light);border-color:var(--accent)}
.habit-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--tr);cursor:pointer;font-size:12px}
.habit-check.checked{background:var(--accent);border-color:var(--accent);color:white}
.habit-name{flex:1;font-size:13.5px}
.habit-name.done{text-decoration:line-through;color:var(--text-muted)}
.habit-streak{font-size:12px;color:var(--text-muted);background:var(--bg);padding:2px 8px;border-radius:20px}
.habit-cat{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--accent-light);color:var(--accent);text-transform:uppercase;letter-spacing:.3px}

/* ===== CALENDAR ===== */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav h3{font-family:var(--font-heading);font-size:17px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-day-name{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;padding:6px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden}
.cal-day{background:white;min-height:70px;padding:6px;cursor:pointer;transition:background var(--tr);position:relative}
.cal-day:hover{background:var(--accent-light)}
.cal-day.today{background:var(--accent-light)}
.cal-day.today .cal-day-num{background:var(--accent);color:white;border-radius:50%}
.cal-day.other-month{background:var(--bg);opacity:.55}
.cal-day-num{font-size:12px;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.cal-event-dot{font-size:10px;background:var(--accent);color:white;border-radius:3px;padding:1px 4px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== TIME BLOCKS ===== */
.time-block{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:8px;border:1.5px solid var(--border)}
.block-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ===== MOOD ===== */
.mood-picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mood-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:white;font-size:22px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.mood-btn.selected,.mood-btn:hover{border-color:var(--accent);background:var(--accent-light)}

/* ===== TRIP CARD ===== */
.trip-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;transition:box-shadow var(--tr),transform var(--tr);border:1.5px solid var(--border);margin-bottom:12px;position:relative;overflow:hidden}
.trip-card::before{content:'';position:absolute;top:0;left:0;right:0;pointer-events:none;border-radius:var(--radius) var(--radius) 0 0}
[data-theme="blackwhite"] .trip-card::before{border-top:3px double #1a1a1a;height:6px}
[data-theme="blush"] .trip-card::before{height:3px;background:linear-gradient(135deg,#EFCED7,#e8b5c0)}
[data-theme="blue"] .trip-card::before{height:3px;background:linear-gradient(135deg,#79A3C3,#b0cede)}
.trip-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(-1px)}
.trip-card h3{font-family:var(--font-heading);font-size:16px;margin-bottom:4px}

/* ===== THEME PICKER ===== */
.theme-options{display:flex;gap:14px;flex-wrap:wrap}
.theme-option{cursor:pointer;border-radius:12px;overflow:hidden;border:3px solid transparent;transition:var(--tr);width:115px}
.theme-option.selected{border-color:var(--accent)}
.theme-preview{height:54px;display:flex;border-radius:9px 9px 0 0;overflow:hidden}
.theme-preview-bar{width:28px;height:100%}
.theme-preview-main{flex:1;background:white;padding:6px;display:flex;flex-direction:column;gap:4px}
.theme-preview-stripe{height:3px;border-radius:2px;width:100%}
.theme-preview-line{height:4px;background:#eee;border-radius:2px;width:80%}
.theme-option p{text-align:center;font-size:12px;font-weight:600;padding:6px;background:var(--bg)}

/* ===== STARS ===== */
.star{font-size:18px;cursor:pointer;color:#d1d5db;transition:color .1s}
.star.lit{color:#fbbf24}

/* ===== MEAL GRID ===== */
.meal-grid{display:grid;grid-template-columns:80px repeat(7,1fr);gap:4px;font-size:12px}
.meal-col-header{font-weight:700;text-align:center;padding:6px 4px;background:var(--bg);border-radius:6px;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
.meal-row-label{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);display:flex;align-items:center;padding-right:6px}
.meal-cell textarea{width:100%;padding:5px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--font-body);font-size:12px;resize:none;min-height:52px;outline:none;transition:border-color var(--tr)}
.meal-cell textarea:focus{border-color:var(--accent)}

/* ===== ROUTINE ===== */
.routine-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:6px;background:white}
.routine-item input{flex:1;border:none;outline:none;font-family:var(--font-body);font-size:13.5px;background:transparent}
.routine-arrows{display:flex;flex-direction:column;gap:1px}
.rarrow{background:none;border:none;font-size:10px;color:var(--text-muted);padding:0 3px;line-height:1.2}
.rarrow:hover{color:var(--accent)}

/* ===== PACKING CHECKLIST ===== */
.pack-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);margin-bottom:6px}
.pack-item.packed{background:var(--accent-light);border-color:var(--accent)}
.pack-item label{flex:1;cursor:pointer;font-size:13.5px}
.pack-item.packed label{text-decoration:line-through;color:var(--text-muted)}

/* ===== JOURNAL ===== */
.journal-entry{border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.journal-entry-header{padding:12px 16px;background:var(--bg);display:flex;align-items:center;gap:10px;cursor:pointer}
.journal-entry-header:hover{background:var(--accent-light)}
.journal-entry-body{padding:14px 16px;display:none;border-top:1px solid var(--border)}
.journal-entry-body.open{display:block}

/* ===== MISC UTILS ===== */
.flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.text-sm{font-size:12px}.text-muted{color:var(--text-muted)}.text-accent{color:var(--accent)}.font-bold{font-weight:700}.italic{font-style:italic}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.hidden{display:none!important}
.w-full{width:100%}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#bbb}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main-content{margin-left:0}
  #top-bar{display:flex}
  #overlay.show{display:block}
  #app-content{padding:16px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .grid-7{grid-template-columns:repeat(2,1fr)}
  .meal-grid{grid-template-columns:60px repeat(3,1fr)}
  .cal-day{min-height:44px;padding:3px}
  .section-header h1{font-size:22px}
  .form-row{flex-direction:column}
  .tab-btn{padding:8px 12px;font-size:12px}
}
@media(max-width:480px){
  .auth-card{padding:24px 18px}
  .meal-grid{grid-template-columns:55px 1fr 1fr}
}
</style>

<body>

<!-- Save Indicator -->
<div id="save-indicator">Saving…</div>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>Life Planner Pro</h1>
    <p class="auth-subtitle">Your all-in-one personal organizer</p>
    <div class="auth-tabs">
      <button class="auth-tab-btn active" onclick="showAuthTab('login')">Sign In</button>
      <button class="auth-tab-btn" onclick="showAuthTab('signup')">Sign Up</button>
    </div>
    <!-- Login -->
    <div id="auth-login">
      <div class="auth-form-group">
        <input class="auth-input" type="email" id="login-email" placeholder="Email address" autocomplete="email">
      </div>

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function progressClass(pct) {
  if (pct >= 80) return 'progress-green';
  if (pct >= 40) return 'progress-yellow';
  return 'progress-red';
}

function badgeForPriority(p) {
  if (p === 'High') return 'badge-red';
  if (p === 'Medium') return 'badge-yellow';
  return 'badge-green';
}

function badgeForStatus(s) {
  const map = {
    'Todo':'badge-gray','In Progress':'badge-blue','Done':'badge-green',
    'Idea':'badge-gray','Drafted':'badge-yellow','Scheduled':'badge-blue','Published':'badge-green',
    'Negotiating':'badge-yellow','Confirmed':'badge-blue','Completed':'badge-green',
    'Active':'badge-blue','Paused':'badge-yellow','Completed':'badge-green'
  };
  return map[s] || 'badge-gray';
}

// Calculate streak for a habit
function calcStreak(habit) {
  if (!habit.completedDates || !habit.completedDates.length) return 0;
  const sorted = [...habit.completedDates].sort().reverse();
  let streak = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  let check = new Date(today);
  for (let i = 0; i < 365; i++) {
    const ds = check.getFullYear() + '-' + String(check.getMonth()+1).padStart(2,'0') + '-' + String(check.getDate()).padStart(2,'0');
    if (sorted.includes(ds)) { streak++; check.setDate(check.getDate()-1); }
    else if (i === 0) { check.setDate(check.getDate()-1); } // allow today not done yet
    else break;
  }
  return streak;
}

// Is habit completed today?
function isHabitDoneToday(habit) {
  return habit.completedDates && habit.completedDates.includes(todayStr());
}

// Toggle habit completion for today
function toggleHabitToday(habitId) {
  const h = state.habits.find(x => x.id === habitId);
  if (!h) return;
  const today = todayStr();
  if (!h.completedDates) h.completedDates = [];
  const idx = h.completedDates.indexOf(today);
  if (idx > -1) h.completedDates.splice(idx, 1);
  else h.completedDates.push(today);
  h.streak = calcStreak(h);
  save('habits');
  // Re-render current section if it uses habits
  if (['home','habits','health'].includes(currentSection)) renderSection(currentSection);
}

      ${activeHabits.length > 10 ? `<p class="text-sm text-muted mt-2">+${activeHabits.length-10} more in Habits section</p>` : ''}
    </div>
    <div class="card">
      <div class="card-title">📅 Upcoming Events</div>
      ${upcomingRows}
    </div>
  </div>`;
}

function initHome() {
  clearInterval(quoteTimer);
  quoteIdx = 0;
  quoteTimer = setInterval(() => {
    quoteIdx = (quoteIdx + 1) % QUOTES.length;
    const el = document.getElementById('home-quote');
    if (!el) { clearInterval(quoteTimer); return; }
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = QUOTES[quoteIdx]; el.style.opacity = '1'; }, 400);
  }, 7000);
}

function handleCoverUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    state.coverPhoto = e.target.result;
    save('coverPhoto');
    renderSection('home');
  };
  reader.readAsDataURL(file);
}

/* ===========================
   PLANNER
=========================== */
function renderPlanner() {
  const tab = currentTabs.planner || 'daily';
  const tabs = ['Daily','Weekly','Monthly','Yearly','Calendar'];
  const tbar = tabs.map(t => `<button class="tab-btn ${tab===t.toLowerCase()?'active':''}" onclick="setPlannerTab('${t.toLowerCase()}')">${t}</button>`).join('');
  return `
  <div class="section-header"><h1>Planner</h1></div>
  <div class="tab-bar">${tbar}</div>
  <div id="planner-body">${renderPlannerTab(tab)}</div>`;
}

function setPlannerTab(tab) {
  currentTabs.planner = tab;
  const el = document.getElementById('planner-body');
  if (el) el.innerHTML = renderPlannerTab(tab);
  document.querySelectorAll('#app-content .tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === tab));
  if (tab === 'calendar') initCalendar();
}

function renderPlannerTab(tab) {
  if (tab === 'daily') return renderPlannerDaily();
  if (tab === 'weekly') return renderPlannerWeekly();
  if (tab === 'monthly') return renderPlannerMonthly();
  if (tab === 'yearly') return renderPlannerYearly();
  if (tab === 'calendar') return renderPlannerCalendar();
  return '';
}

function renderPlannerDaily() {
  const today = todayStr();
  const dateVal = currentTabs.plannerDate || today;
  const blocks = (state.timeBlocks[dateVal] || []);
  const colors = ['#f87171','#fbbf24','#34d399','#60a5fa','#c084fc','#f9a8d4'];
  const blockRows = blocks.map((b, i) => `
    <div class="time-block">
      <div class="block-dot" style="background:${b.color||'#888'}"></div>
      <input class="input" style="width:90px;flex-shrink:0" type="text" value="${esc(b.time)}" placeholder="8:00 AM"
        onchange="updateBlock('${dateVal}',${i},'time',this.value)">
      <input class="input flex-1" type="text" value="${esc(b.task)}" placeholder="Task or event…"
        onchange="updateBlock('${dateVal}',${i},'task',this.value)">
      <select class="select" style="width:100px;flex-shrink:0" onchange="updateBlock('${dateVal}',${i},'color',this.value)">
        ${colors.map(c => `<option value="${c}" ${b.color===c?'selected':''} style="background:${c}">${c}</option>`).join('')}
      </select>
      <button class="btn btn-danger btn-sm btn-icon" onclick="removeBlock('${dateVal}',${i})">✕</button>
    </div>`).join('');
  const activeHabits = (state.habits||[]).filter(h=>h.active).slice(0,8);
  const habitMini = activeHabits.map(h => {
    const done = h.completedDates && h.completedDates.includes(dateVal);
    return `<div class="habit-item ${done?'completed':''}" style="margin-bottom:6px">
      <div class="habit-check ${done?'checked':''}" onclick="toggleHabitToday('${h.id}')">
        ${done?'✓':''}
      </div>
      <span class="habit-name ${done?'done':''}" style="font-size:13px">${esc(h.name)}</span>
    </div>`;
  }).join('');
  return `
  <div class="grid-2">
    <div>
      <div class="card">
        <div class="flex justify-between items-center mb-3">
          <div class="card-title" style="margin-bottom:0">Time Blocks</div>
          <input class="input" type="text" value="${dateVal}" style="width:140px"
            placeholder="YYYY-MM-DD" onchange="setPlannerDate(this.value)">
        </div>
        ${blockRows}
        <button class="btn btn-secondary btn-sm mt-2" onclick="addBlock('${dateVal}')">+ Add Time Block</button>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-title">Today's Habits</div>
        ${habitMini || '<p class="text-muted text-sm">Set up habits in Habits & Routines.</p>'}
      </div>
    </div>
  </div>`;
}

function setPlannerDate(val) {
  currentTabs.plannerDate = val;
  const el = document.getElementById('planner-body');
  if (el) el.innerHTML = renderPlannerTab(currentTabs.planner || 'daily');
}

function addBlock(date) {
  if (!state.timeBlocks[date]) state.timeBlocks[date] = [];
  state.timeBlocks[date].push({time:'',task:'',color:'#60a5fa'});
  save('timeBlocks');
  setPlannerDate(date);
}

function removeBlock(date, idx) {
  state.timeBlocks[date].splice(idx, 1);
  save('timeBlocks');
  setPlannerDate(date);
}

function updateBlock(date, idx, field, val) {
  if (!state.timeBlocks[date]) return;
  state.timeBlocks[date][idx][field] = val;
  save('timeBlocks');
}

function renderPlannerWeekly() {
  const wp = state.weeklyPlanner || {};
  return `<div class="card">
    <div class="card-title">Weekly Planner</div>
    <div class="grid-7">${DAYS.map((d,i)=>`
      <div>
        <div style="font-weight:700;font-size:12px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;text-align:center">${DAY_LABELS[i]}</div>
        <textarea class="textarea" style="min-height:140px;font-size:13px" placeholder="Notes for ${DAY_LABELS[i]}…"
          onchange="updateWeeklyPlan('${d}',this.value)">${esc(wp[d]||'')}</textarea>
      </div>`).join('')}
    </div>
  </div>`;
}

function updateWeeklyPlan(day, val) {
  state.weeklyPlanner[day] = val;
  save('weeklyPlanner');
}

function renderPlannerMonthly() {
  const mn = state.monthlyNotes || {};
  const now = new Date();
  const key = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  return `<div class="card">
    <div class="card-title">Monthly Notes — ${MONTHS[now.getMonth()]} ${now.getFullYear()}</div>
    <textarea class="textarea w-full" style="min-height:300px" placeholder="Monthly goals, reflections, important dates…"
      onchange="state.monthlyNotes['${key}']=this.value;save('monthlyNotes')">${esc(mn[key]||'')}</textarea>
  </div>`;
}

function renderPlannerYearly() {
  const yn = state.yearlyNotes || {};
  const monthKeys = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  return `<div class="card">
    <div class="card-title">Yearly Overview</div>
    <div class="grid-3">${MONTH_SHORT.map((m,i)=>`
      <div>
        <label class="form-group" style="display:block"><span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">${m}</span>
        <textarea class="textarea" style="min-height:80px;font-size:12.5px;margin-top:4px" placeholder="Goals & notes…"
          onchange="state.yearlyNotes['${monthKeys[i]}']=this.value;save('yearlyNotes')">${esc(yn[monthKeys[i]]||'')}</textarea>
        </label>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderPlannerCalendar() {
  const now = new Date();
  const y = currentTabs.calYear || now.getFullYear();
  const m = currentTabs.calMonth !== undefined ? currentTabs.calMonth : now.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayStr();
  const yearOpts = [];
  for (let yr=2020;yr<=2050;yr++) yearOpts.push(`<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`);
  let cells = '';
  const offset = firstDay === 0 ? 6 : firstDay - 1; // Monday-start
  for (let i=0;i<offset;i++) cells += `<div class="cal-day other-month"></div>`;
  for (let d=1;d<=daysInMonth;d++) {
    const ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = ds === today;
    const evts = (state.calendarEvents||[]).filter(e=>e.date===ds);
    cells += `<div class="cal-day ${isToday?'today':''}" onclick="openCalDay('${ds}')">
      <div class="cal-day-num">${d}</div>
      ${evts.slice(0,2).map(e=>`<div class="cal-event-dot" style="background:${e.color||'var(--accent)'}">${esc(e.title)}</div>`).join('')}
      ${evts.length>2?`<div class="text-sm text-muted">+${evts.length-2}</div>`:''}
    </div>`;
  }
  return `
  <div class="card">
    <div class="cal-nav">
      <button class="btn btn-ghost btn-sm" onclick="shiftCal(-1)">← Prev</button>
      <h3>${MONTHS[m]} <select class="select" style="width:90px;display:inline-block;padding:4px 8px" onchange="setCalYear(+this.value)">${yearOpts.join('')}</select></h3>
      <button class="btn btn-ghost btn-sm" onclick="shiftCal(1)">Next →</button>
    </div>
    <div class="cal-header">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
    <div class="calendar-grid">${cells}</div>
  </div>
  <div id="cal-event-panel" class="card" style="display:none"></div>`;
}

function shiftCal(dir) {
  let m = currentTabs.calMonth !== undefined ? currentTabs.calMonth : new Date().getMonth();
  let y = currentTabs.calYear || new Date().getFullYear();
  m += dir;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  currentTabs.calMonth = m; currentTabs.calYear = y;
  const el = document.getElementById('planner-body');
  if (el) el.innerHTML = renderPlannerCalendar();
}

function setCalYear(y) {
  currentTabs.calYear = y;
  const el = document.getElementById('planner-body');
  if (el) el.innerHTML = renderPlannerCalendar();
}

function openCalDay(ds) {
  const panel = document.getElementById('cal-event-panel');
  if (!panel) return;
  const evts = (state.calendarEvents||[]).filter(e=>e.date===ds);
  const list = evts.map((e,i)=>`<div class="flex items-center gap-2 mb-2">
    <span style="width:10px;height:10px;border-radius:50%;background:${e.color||'#888'};display:inline-block;flex-shrink:0"></span>
    <span style="flex:1">${esc(e.title)}</span>
    <button class="btn btn-danger btn-sm btn-icon" onclick="removeCalEvent('${e.id}')">✕</button>
  </div>`).join('');
  panel.style.display = 'block';
  panel.innerHTML = `<div class="card-title">Events for ${ds}</div>
    ${list || '<p class="text-muted text-sm">No events.</p>'}
    <div class="form-row mt-2">
      <input class="input flex-1" type="text" id="new-evt-title" placeholder="Event title">
      <select class="select" id="new-evt-color" style="width:100px">
        <option value="#60a5fa">Blue</option><option value="#f87171">Red</option>
        <option value="#34d399">Green</option><option value="#fbbf24">Yellow</option>
        <option value="#c084fc">Purple</option><option value="#f9a8d4">Pink</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="addCalEvent('${ds}')">Add</button>
    </div>`;
}

function addCalEvent(ds) {
  const t = document.getElementById('new-evt-title').value.trim();
  const c = document.getElementById('new-evt-color').value;
  if (!t) return;
  if (!Array.isArray(state.calendarEvents)) state.calendarEvents = [];
  state.calendarEvents.push({id:uid(), date:ds, title:t, color:c});
  save('calendarEvents');
  openCalDay(ds);
}

function removeCalEvent(id) {
  state.calendarEvents = (state.calendarEvents||[]).filter(e=>e.id!==id);
  save('calendarEvents');
  const panel = document.getElementById('cal-event-panel');
  if (panel) panel.innerHTML = '<p class="text-muted text-sm">Event removed.</p>';
  // refresh calendar
  const el = document.getElementById('planner-body');
  if (el) el.innerHTML = renderPlannerCalendar();
}

function initPlanner() {
  if (!currentTabs.planner) currentTabs.planner = 'daily';
}

function initCalendar() {
  // already rendered inline
}

=========================== */
function renderHabits() {
  const tab = currentTabs.habits || 'habits';
  const tbar = ['Habits','Morning Routine','Night Routine','Streaks'].map(t=>{
    const key = t.toLowerCase().replace(/ /g,'_');
    return `<button class="tab-btn ${tab===key?'active':''}" onclick="setHabitsTab('${key}')">${t}</button>`;

  <div class="tab-bar">${tbar}</div>
  <div id="habits-body">${renderHabitsTab(tab)}</div>`;

function setHabitsTab(tab) {
  currentTabs.habits = tab;
  const el = document.getElementById('habits-body');
  if (el) el.innerHTML = renderHabitsTab(tab);
  document.querySelectorAll('#app-content .tab-btn').forEach(b => {
    const k = b.textContent.toLowerCase().replace(/ /g,'_');

function renderHabitsTab(tab) {

function renderHabitsList() {

    return `<div class="habit-item ${done?'completed':''}">
      <div class="habit-check ${done?'checked':''}" onclick="toggleHabitToday('${h.id}')">
        ${done?'✓':''}
      </div>

  </div>`;
}

function showAddHabitForm() {
  const el = document.getElementById('add-habit-form');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addCustomHabit() {
  const name = document.getElementById('new-habit-name').value.trim();
  const cat = document.getElementById('new-habit-cat').value;
  if (!name) return;
  state.habits.push({
    id: uid(), name, category: cat, preset: false, active: true,
    schedule:{mon:true,tue:true,wed:true,thu:true,fri:true,sat:false,sun:false},
    completedDates:[], streak:0
  });
  save('habits');
  setHabitsTab('habits');
}

function toggleHabitDay(id, day, checked) {
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  if (!h.schedule) h.schedule = {};
  h.schedule[day] = checked;
  save('habits');
}

function toggleHabitActive(id, active) {
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  h.active = active;
  save('habits');
}

function deleteHabit(id) {
  state.habits = state.habits.filter(x=>x.id!==id);
  save('habits');
  setHabitsTab('habits');
}

function renderRoutine(type) {
  const key = type === 'morning' ? 'morningRoutine' : 'nightRoutine';
  const items = state[key] || [];
  const rows = items.map((item, i)=>`<div class="routine-item">
    <div class="routine-arrows">
      <button class="rarrow" onclick="moveRoutineItem('${key}',${i},-1)">▲</button>
      <button class="rarrow" onclick="moveRoutineItem('${key}',${i},1)">▼</button>
    </div>
    <input type="text" value="${esc(item)}" placeholder="Routine step…"
      onchange="updateRoutineItem('${key}',${i},this.value)">
    <button class="btn btn-danger btn-sm btn-icon" onclick="removeRoutineItem('${key}',${i})">✕</button>
  </div>`).join('');
  const label = type === 'morning' ? '☀️ Morning' : '🌙 Night';
  return `<div class="card">
    <div class="card-title">${label} Routine</div>
    <div id="routine-list-${type}">${rows}</div>
    <button class="btn btn-secondary btn-sm mt-2" onclick="addRoutineItem('${key}','${type}')">+ Add Step</button>
  </div>`;
}

function addRoutineItem(key, type) {
  if (!Array.isArray(state[key])) state[key] = [];
  state[key].push('');
  save(key);
  const el = document.getElementById(`routine-list-${type}`);
  if (el) el.innerHTML = (state[key]).map((item,i)=>`<div class="routine-item">
    <div class="routine-arrows">
      <button class="rarrow" onclick="moveRoutineItem('${key}',${i},-1)">▲</button>
      <button class="rarrow" onclick="moveRoutineItem('${key}',${i},1)">▼</button>
    </div>
    <input type="text" value="${esc(item)}" placeholder="Routine step…"
      onchange="updateRoutineItem('${key}',${i},this.value)">
    <button class="btn btn-danger btn-sm btn-icon" onclick="removeRoutineItem('${key}',${i})">✕</button>
  </div>`).join('');
}

function updateRoutineItem(key, i, val) {
  state[key][i] = val; save(key);
}

function moveRoutineItem(key, i, dir) {
  const arr = state[key];
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  save(key);
  setHabitsTab(currentTabs.habits);
}

function removeRoutineItem(key, i) {
  state[key].splice(i, 1);
  save(key);
  setHabitsTab(currentTabs.habits);
}

function renderStreaks() {
  const active = (state.habits||[]).filter(h=>h.active);
  const rows = active.map(h=>`<tr>
    <td>${esc(h.name)}</td>
    <td><span class="habit-cat">${h.category}</span></td>
    <td style="font-weight:700">🔥 ${calcStreak(h)}</td>
    <td>${h.completedDates ? h.completedDates.length : 0} total</td>
    <td><span class="badge ${isHabitDoneToday(h)?'badge-green':'badge-gray'}">${isHabitDoneToday(h)?'Done':'Pending'}</span></td>

  return `<div class="card">
    <div class="card-title">Streak Tracker</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Habit</th><th>Category</th><th>Streak</th><th>Total</th><th>Today</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="text-muted">No active habits.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

}

  const tabs = ['Weight','Fitness','Workouts','Daily','Appointments'];
  const tbar = tabs.map(t=>`<button class="tab-btn ${tab===t.toLowerCase()?'active':''}" onclick="setHealthTab('${t.toLowerCase()}')">${t}</button>`).join('');
  return `<div class="section-header"><h1>Health & Wellness</h1></div>
  <div class="tab-bar">${tbar}</div>
  <div id="health-body">${renderHealthTab(tab)}</div>`;
}

function setHealthTab(tab) {
  currentTabs.health = tab;
  const el = document.getElementById('health-body');
  if (el) el.innerHTML = renderHealthTab(tab);
  document.querySelectorAll('#app-content .tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===tab));
}

function renderHealthTab(tab) {
  if (tab === 'weight') return renderHealthWeight();
  if (tab === 'fitness') return renderHealthFitness();
  if (tab === 'workouts') return renderHealthWorkouts();
  if (tab === 'daily') return renderHealthDaily();
  if (tab === 'appointments') return renderHealthAppts();
  return '';
}

function renderHealthWeight() {
  const w = state.weight || {};
  const start = parseFloat(w.start) || 0;
  const current = parseFloat(w.current) || 0;
  const goal = parseFloat(w.goal) || 0;
  let pct = 0, cls = 'progress-red';
  if (start && goal && start !== goal) {
    pct = Math.min(100, Math.max(0, Math.round(Math.abs((current - start) / (goal - start)) * 100)));
    cls = pct >= 80 ? 'progress-green' : pct >= 40 ? 'progress-yellow' : 'progress-red';
  }
  const logRows = (w.log||[]).map((e,i)=>`<tr>
    <td>${esc(e.date)}</td>
    <td>${esc(e.weight)}</td>
    <td>${esc(e.note||'')}</td>
    <td><button class="btn btn-danger btn-sm btn-icon" onclick="removeWeightLog(${i})">✕</button></td>
  </tr>`).join('');
  return `<div class="card">
    <div class="card-title">Weight Tracker</div>
    <div class="form-row">
      <div class="form-group"><label>Start Weight</label>

  if (tab==='weekly') return renderMealsWeekly();
  if (tab==='grocery') return renderGrocery();
  if (tab==='prepideas') return renderMealPrep();
  return '';
}

function renderMealsWeekly() {
  const wm = state.weeklyMeals || {};
  const meals = ['Breakfast','Lunch','Dinner'];
  const header = `<div></div>${DAY_LABELS.map(d=>`<div class="meal-col-header">${d}</div>`).join('')}`;
  const rows = meals.map(meal=>{
    const key = meal.toLowerCase();
    const cells = DAYS.map(d=>`<div class="meal-cell">
      <textarea placeholder="${meal}…"
        onchange="updateMeal('${d}','${key}',this.value)">${esc((wm[d]||{})[key]||'')}</textarea>
    </div>`).join('');
    return `<div class="meal-row-label">${meal}</div>${cells}`;
  }).join('');
  return `<div class="card"><div class="card-title">Weekly Meal Planner</div>
    <div style="overflow-x:auto"><div class="meal-grid">${header}${rows}</div></div>
  </div>`;
}

function updateMeal(day, meal, val) {
  if (!state.weeklyMeals) state.weeklyMeals = {};
  if (!state.weeklyMeals[day]) state.weeklyMeals[day] = {};
  state.weeklyMeals[day][meal] = val;
  save('weeklyMeals');
}

function renderGrocery() {
  const cats = ['Produce','Dairy','Meat','Pantry','Other'];
  const items = state.groceryList || [];
  const byCat = {};
  cats.forEach(c => { byCat[c] = items.filter(i=>i.category===c); });
  const listHtml = cats.map(cat=>{
    if (!byCat[cat].length) return '';
    const rows = byCat[cat].map((item,_i)=>{
      const realIdx = items.indexOf(item);
      return `<div class="pack-item ${item.bought?'packed':''}">
        <input type="checkbox" ${item.bought?'checked':''} onchange="toggleGrocery(${realIdx})">
        <label onclick="toggleGrocery(${realIdx})" style="cursor:pointer">${esc(item.name)}</label>
        <button class="btn btn-danger btn-sm btn-icon" onclick="removeGrocery(${realIdx})">✕</button>
      </div>`;
    }).join('');
    return `<div class="mb-3"><strong style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">${cat}</strong><div class="mt-2">${rows}</div></div>`;
  }).join('');
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin-bottom:0">Grocery List</div>
      <button class="btn btn-ghost btn-sm" onclick="clearBoughtGroceries()">Clear Bought</button>
    </div>
    <div class="form-row mb-3">
      <input class="input flex-1" type="text" id="groc-name" placeholder="Item name">
      <select class="select" id="groc-cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
      <button class="btn btn-primary btn-sm" onclick="addGrocery()">Add</button>
    </div>
    ${listHtml || '<p class="text-muted text-sm">Your grocery list is empty.</p>'}
  </div>`;
}

function addGrocery() {
  const name = document.getElementById('groc-name').value.trim();
  const category = document.getElementById('groc-cat').value;
  if (!name) return;
  if (!Array.isArray(state.groceryList)) state.groceryList = [];
  state.groceryList.push({id:uid(),name,category,bought:false});
  save('groceryList');
  document.getElementById('groc-name').value = '';
  setMealsTab('grocery');
}

function toggleGrocery(i) {
  state.groceryList[i].bought = !state.groceryList[i].bought;
  save('groceryList');
  setMealsTab('grocery');
}

function removeGrocery(i) {
  state.groceryList.splice(i,1);
  save('groceryList');
  setMealsTab('grocery');
}

function clearBoughtGroceries() {
  state.groceryList = (state.groceryList||[]).filter(i=>!i.bought);
  save('groceryList');
  setMealsTab('grocery');
}

function renderMealPrep() {
  const ideas = state.mealPrepIdeas || [];
  const cards = ideas.map((idea,i)=>`<div class="card mb-2" style="padding:14px">
    <div class="flex justify-between items-center">
      <div style="font-size:13.5px">${esc(idea.text)}</div>
      <button class="btn btn-danger btn-sm btn-icon" onclick="removeMealPrep(${i})">✕</button>
    </div>
  </div>`).join('');
  return `<div class="card">
    <div class="card-title">Meal Prep Ideas</div>
    <div class="form-row mb-3">
      <input class="input flex-1" type="text" id="prep-text" placeholder="Prep idea or recipe…">
      <button class="btn btn-primary btn-sm" onclick="addMealPrep()">Add</button>
    </div>
    ${cards || '<p class="text-muted text-sm">No ideas yet. Add some meal prep inspiration!</p>'}
  </div>`;
}

function addMealPrep() {
  const text = document.getElementById('prep-text').value.trim();
  if (!text) return;
  if (!Array.isArray(state.mealPrepIdeas)) state.mealPrepIdeas = [];
  state.mealPrepIdeas.push({id:uid(),text});
  save('mealPrepIdeas');
  document.getElementById('prep-text').value = '';
  setMealsTab('prepideas');
}

function removeMealPrep(i) {
  state.mealPrepIdeas.splice(i,1);
  save('mealPrepIdeas');
  setMealsTab('prepideas');
}

function initMeals() {
  if (!currentTabs.meals) currentTabs.meals = 'weekly';
}

/* ===========================
   TRAVEL
=========================== */
let currentTripId = null;
let currentTripTab = 'overview';

function renderTravel() {
  if (currentTripId) return renderTripDetail();
  return renderTripList();
}

function renderTripList() {
  const trips = state.trips || [];
  const cards = trips.map(t=>`<div class="trip-card" onclick="openTrip('${t.id}')">
    <div class="flex justify-between items-center">
      <h3>${esc(t.name||'Unnamed Trip')}</h3>
      <button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();removeTrip('${t.id}')">✕</button>
    </div>
    <div class="text-sm text-muted">${esc(t.overview&&t.overview.destination||'Destination TBD')} · ${esc(t.overview&&t.overview.dates||'Dates TBD')}</div>
    <div class="flex gap-2 mt-2">
      <span class="badge badge-blue">✈️ Trip</span>
      ${t.packing&&t.packing.length ? `<span class="badge badge-gray">${t.packing.filter(p=>p.packed).length}/${t.packing.length} packed</span>` : ''}
    </div>
  </div>`).join('');
  return `<div class="section-header flex justify-between items-center">
    <h1>Travel</h1>
    <button class="btn btn-primary" onclick="addTrip()">+ New Trip</button>
  </div>
  ${cards || '<div class="card"><p class="text-muted">No trips yet. Add one to get started!</p></div>'}`;
}

function addTrip() {
  if (!Array.isArray(state.trips)) state.trips = [];
  const trip = {id:uid(),name:'New Trip',overview:{destination:'',dates:'',accommodation:'',notes:''},
    logistics:{flights:'',transport:'',confirmation:''},itinerary:[],
    budget:{total:'',categories:[]},packing:[]};
  state.trips.push(trip);
  save('trips');
  currentTripId = trip.id;
  currentTripTab = 'overview';
  renderSection('travel');
}

function removeTrip(id) {
  if (!confirm('Delete this trip?')) return;
  state.trips = state.trips.filter(t=>t.id!==id);
  save('trips');
  renderSection('travel');
}

function openTrip(id) {
  currentTripId = id;
  currentTripTab = 'overview';
  renderSection('travel');
}

function renderTripDetail() {
  const trip = (state.trips||[]).find(t=>t.id===currentTripId);
  if (!trip) { currentTripId=null; return renderTripList(); }
  const tabs = ['Overview','Logistics','Itinerary','Budget','Packing'];
  const tbar = tabs.map(t=>`<button class="tab-btn ${currentTripTab===t.toLowerCase()?'active':''}" onclick="setTripTab('${t.toLowerCase()}')">${t}</button>`).join('');
  let body = '';
  if (currentTripTab==='overview') body = renderTripOverview(trip);
  else if (currentTripTab==='logistics') body = renderTripLogistics(trip);
  else if (currentTripTab==='itinerary') body = renderTripItinerary(trip);
  else if (currentTripTab==='budget') body = renderTripBudget(trip);
  else if (currentTripTab==='packing') body = renderTripPacking(trip);
  return `<div class="section-header">
    <div class="flex items-center gap-3">
      <button class="btn btn-ghost btn-sm" onclick="currentTripId=null;renderSection('travel')">← All Trips</button>
      <input class="input" type="text" value="${esc(trip.name)}" style="font-family:var(--font-heading);font-size:20px;border:none;box-shadow:none;padding:0;font-weight:700;flex:1"
        onchange="trip_rename('${trip.id}',this.value)">
    </div>
  </div>
  <div class="tab-bar">${tbar}</div>
  <div id="trip-body">${body}</div>`;
}

function trip_rename(id, name) {
  const t = state.trips.find(x=>x.id===id);
  if (t) { t.name = name; save('trips'); }
}

function setTripTab(tab) {
  currentTripTab = tab;
  const el = document.getElementById('trip-body');
  const trip = (state.trips||[]).find(t=>t.id===currentTripId);
  if (!el || !trip) return;
  let html = '';
  if (tab==='overview') html = renderTripOverview(trip);
  else if (tab==='logistics') html = renderTripLogistics(trip);
  else if (tab==='itinerary') html = renderTripItinerary(trip);
  else if (tab==='budget') html = renderTripBudget(trip);
  else if (tab==='packing') html = renderTripPacking(trip);
  el.innerHTML = html;
  document.querySelectorAll('#app-content .tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===tab));
}

function renderTripOverview(trip) {
  const o = trip.overview || {};
  return `<div class="card">
    <div class="card-title">Trip Overview</div>
    <div class="form-row">
      <div class="form-group"><label>Destination</label>
        <input class="input" type="text" value="${esc(o.destination||'')}" placeholder="Paris, France"
          onchange="updateTripField('${trip.id}','overview','destination',this.value)">
      </div>
      <div class="form-group"><label>Dates</label>
        <input class="input" type="text" value="${esc(o.dates||'')}" placeholder="July 10-17, 2026"
          onchange="updateTripField('${trip.id}','overview','dates',this.value)">
      </div>
      <div class="form-group"><label>Accommodation</label>
        <input class="input" type="text" value="${esc(o.accommodation||'')}" placeholder="Hotel name / Airbnb"
          onchange="updateTripField('${trip.id}','overview','accommodation',this.value)">
      </div>
    </div>
    <div class="form-group"><label>Notes</label>
      <textarea class="textarea w-full" placeholder="Trip notes, must-sees, tips…"
        onchange="updateTripField('${trip.id}','overview','notes',this.value)">${esc(o.notes||'')}</textarea>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="addTripToCalendar('${trip.id}')">📅 Add to Calendar</button>
  </div>`;
}

function updateTripField(id, section, field, val) {
  const t = state.trips.find(x=>x.id===id);
  if (!t) return;
  if (!t[section]) t[section] = {};
  t[section][field] = val;
  save('trips');
}

function addTripToCalendar(id) {
  const t = state.trips.find(x=>x.id===id);
  if (!t) return;
  if (!Array.isArray(state.calendarEvents)) state.calendarEvents = [];
  const dates = (t.overview&&t.overview.dates||'').trim();
  const dest = t.name || 'Trip';
  state.calendarEvents.push({id:uid(), date:todayStr(), title:`✈️ ${dest}${dates?' ('+dates+')':''}`, color:'#60a5fa'});
  save('calendarEvents');
  alert('Trip added to calendar!');
}

function renderTripLogistics(trip) {
  const l = trip.logistics || {};
  return `<div class="card">
    <div class="card-title">Logistics</div>
    <div class="form-group"><label>Flights</label>
      <textarea class="textarea w-full" placeholder="Flight numbers, departure times, airports…"
        onchange="updateTripField('${trip.id}','logistics','flights',this.value)">${esc(l.flights||'')}</textarea>
    </div>
    <div class="form-group"><label>Ground Transport</label>
      <textarea class="textarea w-full" placeholder="Car rental, trains, buses, rideshare…"
        onchange="updateTripField('${trip.id}','logistics','transport',this.value)">${esc(l.transport||'')}</textarea>
    </div>
    <div class="form-group"><label>Confirmation Numbers</label>
      <textarea class="textarea w-full" placeholder="Booking references, confirmation codes…"
        onchange="updateTripField('${trip.id}','logistics','confirmation',this.value)">${esc(l.confirmation||'')}</textarea>
    </div>
  </div>`;
}

function renderTripItinerary(trip) {
  const days = trip.itinerary || [];
  const dayCards = days.map((d,i)=>`<div class="card mb-2" style="padding:14px">
    <div class="flex justify-between items-center mb-2">
      <div class="flex gap-2 items-center">
        <strong>Day ${i+1}</strong>
        <input class="input" type="text" value="${esc(d.date||'')}" placeholder="YYYY-MM-DD" style="width:130px"
          onchange="updateItineraryDay('${trip.id}',${i},'date',this.value)">
      </div>
      <button class="btn btn-danger btn-sm btn-icon" onclick="removeItineraryDay('${trip.id}',${i})">✕</button>
    </div>
    <textarea class="textarea w-full" style="min-height:80px" placeholder="Activities, places to visit…"
      onchange="updateItineraryDay('${trip.id}',${i},'activities',this.value)">${esc(d.activities||'')}</textarea>
  </div>`).join('');
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin-bottom:0">Itinerary</div>
      <button class="btn btn-primary btn-sm" onclick="addItineraryDay('${trip.id}')">+ Add Day</button>
    </div>
    ${dayCards || '<p class="text-muted text-sm">No days planned yet.</p>'}
  </div>`;
}

function addItineraryDay(tripId) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t) return;
  if (!Array.isArray(t.itinerary)) t.itinerary = [];
  t.itinerary.push({date:'',activities:''});
  save('trips');
  setTripTab('itinerary');
}

function removeItineraryDay(tripId, i) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t) return;
  t.itinerary.splice(i,1);
  save('trips');
  setTripTab('itinerary');
}

function updateItineraryDay(tripId, i, field, val) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t || !t.itinerary[i]) return;
  t.itinerary[i][field] = val;
  save('trips');
}

function renderTripBudget(trip) {
  const b = trip.budget || {};
  const cats = b.categories || [];
  const total = parseFloat(b.total)||0;
  const totalSpent = cats.reduce((s,c)=>s+(parseFloat(c.spent)||0),0);
  const catRows = cats.map((c,i)=>{
    const budgeted = parseFloat(c.amount)||0;
    const spent = parseFloat(c.spent)||0;
    const over = spent > budgeted;
    const pct = budgeted ? Math.min(100,Math.round(spent/budgeted*100)) : 0;
    return `<div class="card mb-2" style="padding:14px">
      <div class="flex gap-2 items-center mb-2">
        <input class="input flex-1" type="text" value="${esc(c.name||'')}" placeholder="Category"
          onchange="updateTripBudgetCat('${trip.id}',${i},'name',this.value)">
        <input class="input" type="text" value="${esc(c.amount||'')}" placeholder="Budget $" style="width:110px"
          onchange="updateTripBudgetCat('${trip.id}',${i},'amount',this.value)">
        <input class="input" type="text" value="${esc(c.spent||'')}" placeholder="Spent $" style="width:110px"
          onchange="updateTripBudgetCat('${trip.id}',${i},'spent',this.value)">
        <button class="btn btn-danger btn-sm btn-icon" onclick="removeTripBudgetCat('${trip.id}',${i})">✕</button>
      </div>
      <div class="progress-wrap"><div class="progress-fill ${over?'progress-red':'progress-green'}" style="width:${pct}%"></div></div>
      <div class="flex justify-between text-sm text-muted mt-1">
        <span>$${spent.toFixed(2)} spent</span>
        <span class="${over?'text-accent':'badge-green'}">${over?'Over by $'+(spent-budgeted).toFixed(2):'$'+(budgeted-spent).toFixed(2)+' remaining'}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-title">Trip Budget</div>
    <div class="flex gap-3 items-center mb-3">
      <div class="form-group flex-1" style="margin-bottom:0"><label>Total Budget ($)</label>
        <input class="input" type="text" value="${esc(b.total||'')}" placeholder="2000"
          onchange="updateTripBudgetTotal('${trip.id}',this.value)">
      </div>
      <div class="text-sm text-muted mt-3">Spent: $${totalSpent.toFixed(2)} / $${(total||0).toFixed(2)}</div>
    </div>
    ${catRows}
    <button class="btn btn-secondary btn-sm mt-2" onclick="addTripBudgetCat('${trip.id}')">+ Add Category</button>
  </div>`;
}

function updateTripBudgetTotal(tripId, val) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t) return;
  if (!t.budget) t.budget = {};
  t.budget.total = val;
  save('trips');
}

function addTripBudgetCat(tripId) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t) return;
  if (!t.budget) t.budget = {total:'',categories:[]};
  if (!Array.isArray(t.budget.categories)) t.budget.categories = [];
  t.budget.categories.push({name:'',amount:'',spent:''});
  save('trips');
  setTripTab('budget');
}

function updateTripBudgetCat(tripId, i, field, val) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t||!t.budget||!t.budget.categories[i]) return;
  t.budget.categories[i][field] = val;
  save('trips');
}

function removeTripBudgetCat(tripId, i) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t||!t.budget) return;
  t.budget.categories.splice(i,1);
  save('trips');
  setTripTab('budget');
}

function renderTripPacking(trip) {
  const items = trip.packing || [];
  const packed = items.filter(i=>i.packed).length;
  const pct = items.length ? Math.round(packed/items.length*100) : 0;
  const list = items.map((item,i)=>`<div class="pack-item ${item.packed?'packed':''}">
    <input type="checkbox" ${item.packed?'checked':''} onchange="togglePackItem('${trip.id}',${i})">
    <label onclick="togglePackItem('${trip.id}',${i})">${esc(item.name)}</label>
    <button class="btn btn-danger btn-sm btn-icon" onclick="removePackItem('${trip.id}',${i})">✕</button>
  </div>`).join('');
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin-bottom:0">Packing List</div>
      <span class="badge badge-blue">${packed}/${items.length} packed</span>
    </div>
    ${items.length ? `<div class="progress-wrap mb-3"><div class="progress-fill progress-green" style="width:${pct}%"></div></div>` : ''}
    <div class="form-row mb-3">
      <input class="input flex-1" type="text" id="pack-item-name" placeholder="Add item…">
      <button class="btn btn-primary btn-sm" onclick="addPackItem('${trip.id}')">Add</button>
    </div>
    ${list || '<p class="text-muted text-sm">Packing list is empty.</p>'}
  </div>`;
}

function addPackItem(tripId) {
  const name = document.getElementById('pack-item-name').value.trim();
  if (!name) return;
  const t = state.trips.find(x=>x.id===tripId);
  if (!t) return;
  if (!Array.isArray(t.packing)) t.packing = [];
  t.packing.push({name, packed:false});
  save('trips');
  document.getElementById('pack-item-name').value = '';
  setTripTab('packing');
}

function togglePackItem(tripId, i) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t||!t.packing[i]) return;
  t.packing[i].packed = !t.packing[i].packed;
  save('trips');
  setTripTab('packing');
}

function removePackItem(tripId, i) {
  const t = state.trips.find(x=>x.id===tripId);
  if (!t) return;
  t.packing.splice(i,1);
  save('trips');
  setTripTab('packing');
}

function initTravel() {}

   FINANCE
=========================== */
function renderFinance() {
  const tab = currentTabs.finance || 'income';
  const tabs = ['Income','Tax','Budget','Debt','Expenses','Savings','Accounts'];
  const tbar = tabs.map(t=>`<button class="tab-btn ${tab===t.toLowerCase()?'active':''}" onclick="setFinanceTab('${t.toLowerCase()}')">${t}</button>`).join('');
  return `<div class="section-header"><h1>Finance</h1></div>
  <div class="tab-bar">${tbar}</div>
  <div id="finance-body">${renderFinanceTab(tab)}</div>`;
}

function setFinanceTab(tab) {
  currentTabs.finance = tab;
  const el = document.getElementById('finance-body');
  if (el) el.innerHTML = renderFinanceTab(tab);
  document.querySelectorAll('#app-content .tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===tab));
}

function renderFinanceTab(tab) {
  if (tab==='income') return renderIncomeTab();
  if (tab==='tax') return renderTaxTab();
  if (tab==='budget') return renderBudgetTab();
  if (tab==='debt') return renderDebtTab();
  if (tab==='expenses') return renderExpensesTab();
  if (tab==='savings') return renderSavingsTab();
  if (tab==='accounts') return renderAccountsTab();
  return '';
}

function renderIncomeTab() {
  const inc = state.income || [];
  const total = inc.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const rows = inc.map((e,i)=>`<tr>
    <td>${esc(e.source)}</td>
    <td>$${parseFloat(e.amount||0).toFixed(2)}</td>
    <td>${esc(e.date)}</td>
    <td><span class="badge badge-blue">${esc(e.type)}</span></td>
    <td><button class="btn btn-danger btn-sm btn-icon" onclick="removeIncome(${i})">✕</button></td>
  </tr>`).join('');
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin-bottom:0">Income Tracker</div>
      <div class="stat-value" style="font-size:20px">$${total.toFixed(2)}</div>
    </div>
    <div class="form-row mb-3">
      <div class="form-group"><label>Source</label><input class="input" type="text" id="inc-src" placeholder="Employer name"></div>
      <div class="form-group"><label>Amount ($)</label><input class="input" type="text" id="inc-amt" placeholder="5000"></div>
      <div class="form-group"><label>Date</label><input class="input" type="text" id="inc-date" placeholder="YYYY-MM-DD"></div>
      <div class="form-group"><label>Type</label>
        <select class="select" id="inc-type"><option>Salary</option><option>Freelance</option><option>Passive</option><option>Other</option></select>
      </div>
    </div>
    <button class="btn btn-primary btn-sm mb-3" onclick="addIncome()">+ Add Income</button>
    <div class="table-wrap"><table>
      <thead><tr><th>Source</th><th>Amount</th><th>Date</th><th>Type</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="text-muted">No income entries yet.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function addIncome() {
  const source = document.getElementById('inc-src').value.trim();
  const amount = document.getElementById('inc-amt').value.trim();
  const date = document.getElementById('inc-date').value.trim();
  const type = document.getElementById('inc-type').value;
  if (!source || !amount) return;
  if (!Array.isArray(state.income)) state.income = [];
  state.income.push({source,amount,date,type});
  save('income');
  setFinanceTab('income');
}

function removeIncome(i) {
  state.income.splice(i,1);
  save('income');
  setFinanceTab('income');
}

function renderTaxTab() {
  const ti = state.taxInfo || {};
  const mode = ti.mode || 'w2';
  let result = '';

// Federal income tax brackets 2024
const FED_BRACKETS_SINGLE = [[11600,.10],[47150,.12],[100525,.22],[191950,.24],[243725,.32],[609350,.35],[Infinity,.37]];
const FED_BRACKETS_MFJ    = [[23200,.10],[94300,.12],[201050,.22],[383900,.24],[487450,.32],[731200,.35],[Infinity,.37]];
const FED_BRACKETS_HOH    = [[16550,.10],[63100,.12],[100500,.22],[191950,.24],[243700,.32],[609350,.35],[Infinity,.37]];
const STD_DED = {single:14600, mfj:29200, hoh:21900};

// Approximate state income tax rates
const STATE_TAX = {
  AK:0,FL:0,NV:0,NH:0,SD:0,TN:0,TX:0,WA:0,WY:0,
  AL:.05,AZ:.025,AR:.047,CA:.093,CO:.044,CT:.07,DE:.066,GA:.055,HI:.11,
  ID:.058,IL:.0495,IN:.032,IA:.06,KS:.057,KY:.045,LA:.045,ME:.0715,
  MD:.0575,MA:.05,MI:.0425,MN:.0985,MS:.047,MO:.054,MT:.069,NE:.0684,
  NJ:.1075,NM:.059,NY:.0109,NC:.0499,ND:.029,OH:.04,OK:.05,OR:.099,
  PA:.0307,RI:.0599,SC:.07,UT:.0485,VT:.0875,VA:.0575,WV:.065,WI:.0765
};

function calcFedTax(taxableIncome, filing) {
  const brackets = filing==='mfj' ? FED_BRACKETS_MFJ : filing==='hoh' ? FED_BRACKETS_HOH : FED_BRACKETS_SINGLE;
  let tax=0, prev=0;
  for (const [top, rate] of brackets) {
    if (taxableIncome <= prev) break;
    tax += (Math.min(taxableIncome,top)-prev)*rate;
    prev = top;
  }
  return tax;
}

function calcW2Tax(ti) {
  const salary = parseFloat(ti.salary)||0;
  const filing = ti.filing||'single';
  const stateCode = ti.state||'CA';
  const stdDed = STD_DED[filing]||14600;
  const taxable = Math.max(0, salary - stdDed);
  const fedTax = calcFedTax(taxable, filing);
  const stateTax = salary * (STATE_TAX[stateCode]||0);
  const ficaSS = Math.min(salary,160200)*0.062;
  const ficaMed = salary*0.0145;
  const total = fedTax+stateTax+ficaSS+ficaMed;
  const effRate = salary ? (total/salary*100).toFixed(1) : 0;
  return `<div class="divider"></div>
  <div class="grid-4 mt-3">
    <div class="stat-card"><div class="stat-value" style="font-size:20px">$${fedTax.toFixed(0)}</div><div class="stat-label">Federal Tax</div></div>
    <div class="stat-card"><div class="stat-value" style="font-size:20px">$${stateTax.toFixed(0)}</div><div class="stat-label">State Tax (${stateCode})</div></div>
    <div class="stat-card"><div class="stat-value" style="font-size:20px">$${(ficaSS+ficaMed).toFixed(0)}</div><div class="stat-label">FICA (SS+Med)</div></div>
    <div class="stat-card"><div class="stat-value" style="font-size:20px">${effRate}%</div><div class="stat-label">Effective Rate</div></div>
  </div>
  <div class="card mt-3" style="background:var(--accent-light)">
    <div class="flex justify-between"><span>Annual take-home</span><strong>$${(salary-total).toFixed(2)}</strong></div>
    <div class="flex justify-between text-sm text-muted mt-1"><span>Monthly</span><span>$${((salary-total)/12).toFixed(2)}</span></div>
  </div>`;
}

function calc1099Tax(ti) {
  const gross = parseFloat(ti.freelance)||0;
  const expenses = parseFloat(ti.expenses)||0;
  const filing = ti.filing||'single';
  const net = Math.max(0, gross-expenses);
  const seTaxBase = net * 0.9235;
  const seTax = seTaxBase * 0.153;
  const seDeduction = seTax / 2;
  const stdDed = STD_DED[filing]||14600;
  const taxable = Math.max(0, net - seDeduction - stdDed);
  const fedTax = calcFedTax(taxable, filing);
  const totalTax = fedTax + seTax;
  const quarterly = totalTax / 4;
  const effRate = gross ? (totalTax/gross*100).toFixed(1) : 0;
  return `<div class="divider"></div>
  <div class="grid-4 mt-3">
    <div class="stat-card"><div class="stat-value" style="font-size:20px">$${seTax.toFixed(0)}</div><div class="stat-label">SE Tax (15.3%)</div></div>
    <div class="stat-card"><div class="stat-value" style="font-size:20px">$${fedTax.toFixed(0)}</div><div class="stat-label">Federal Tax</div></div>
    <div class="stat-card"><div class="stat-value" style="font-size:20px">$${totalTax.toFixed(0)}</div><div class="stat-label">Total Tax</div></div>
    <div class="stat-card"><div class="stat-value" style="font-size:20px">${effRate}%</div><div class="stat-label">Effective Rate</div></div>
  </div>
  <div class="card mt-3" style="background:var(--accent-light)">
    <div class="flex justify-between"><strong>Quarterly estimated payment</strong><strong>$${quarterly.toFixed(2)}</strong></div>
    <div class="flex justify-between text-sm text-muted mt-1"><span>Take-home after tax</span><span>$${(gross-totalTax).toFixed(2)}</span></div>
  </div>`;
}

  const filterBtns = ['All','Todo','In Progress','Done'].map(f=>`<button class="btn btn-sm ${filter===f?'btn-primary':'btn-ghost'}" onclick="currentTabs.taskFilter='${f}';setCareerTab('tasks')">${f}</button>`).join('');

    const realIdx = tasks.indexOf(t);
    return `<tr>
      <td>${esc(t.title)}</td>

      <td>${esc(t.dueDate||'')}</td>

      <tbody>${rows||'<tr><td colspan="5" class="text-muted">No tasks yet.</td></tr>'}</tbody>

      <td>${esc(a.class||'')}</td><td>${esc(a.title)}</td><td>${esc(a.dueDate||'')}</td>

      <strong>Assignments</strong><button class="btn btn-primary btn-sm" onclick="addAssignment()">+ Add</button></div>
      <div id="asgn-form" style="display:none" class="mb-3">

          <div class="form-group"><label>Class</label><input class="input" type="text" id="asgn-class" placeholder="Class name"></div>
          <div class="form-group"><label>Title</label><input class="input" type="text" id="asgn-title" placeholder="Assignment name"></div>
          <div class="form-group"><label>Due Date</label><input class="input" type="text" id="asgn-due" placeholder="YYYY-MM-DD"></div>

        <button class="btn btn-primary btn-sm" onclick="saveAssignment()">Add</button>

      <div class="table-wrap"><table><thead><tr><th>Class</th><th>Title</th><th>Due</th><th>Status</th><th>Grade</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="text-muted">No assignments.</td></tr>'}</tbody></table></div>
    </div>`;
  }

  if (subtab==='studysessions') {
    const ss = ac.studySessions||[];

      <td>${esc(s.date)}</td><td>${esc(s.subject)}</td><td>${esc(s.duration)}</td><td>${esc(s.notes||'')}</td>
      <td><button class="btn btn-danger btn-sm btn-icon" onclick="state.academics.studySessions.splice(${i},1);save('academics');setCareerTab('academics')">✕</button></td>

          <div class="form-group"><label>Date</label><input class="input" type="text" id="ss-date" placeholder="YYYY-MM-DD" value="${todayStr()}"></div>

      <tbody>${rows||'<tr><td colspan="5" class="text-muted">No sessions logged.</td></tr>'}</tbody></table></div>

      </tr>`;
    }).join('');
    const gpa = totalCredits ? (totalPoints/totalCredits).toFixed(2) : '—';
    body += `<div class="card">
      <div class="flex justify-between items-center mb-3">
        <strong>GPA Calculator</strong>
        <div class="stat-value" style="font-size:24px">GPA: ${gpa}</div>

    </div>`;

  return body;
