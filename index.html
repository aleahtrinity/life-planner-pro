function initCareer() {
  if (!currentTabs.career) currentTabs.career = 'tasks';
  if (!currentTabs.acaTab) currentTabs.acaTab = 'classes';
}

/* ===========================
   SOCIAL MEDIA HUB
=========================== */
function renderSocial() {
  const tab = currentTabs.social || 'platforms';
  const tbar = ['Platforms','Content Calendar','Brand Deals'].map(t=>{
    const k = t.toLowerCase().replace(/ /g,'');
    return `<button class="tab-btn ${tab===k?'active':''}" onclick="setSocialTab('${k}')">${t}</button>`;
  }).join('');
  return `<div class="section-header"><h1>Social Media Hub</h1></div>
  <div class="tab-bar">${tbar}</div>
  <div id="social-body">${renderSocialTab(tab)}</div>`;
}

function setSocialTab(tab) {
  currentTabs.social = tab;
  const el = document.getElementById('social-body');
  if (el) el.innerHTML = renderSocialTab(tab);
  document.querySelectorAll('#app-content .tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().replace(/ /g,'')=== tab));
}

function renderSocialTab(tab) {
  if (tab==='platforms') return renderPlatforms();
  if (tab==='contentcalendar') return renderContentCal();
  if (tab==='branddeals') return renderBrandDeals();
  return '';
}

function renderPlatforms() {
  const plats = state.platforms || [];
  const cards = plats.map((p,i)=>{
    const followers = parseFloat(p.followers)||0;
    const goal = parseFloat(p.goal)||0;
    const pct = goal ? Math.min(100,Math.round(followers/goal*100)) : 0;
    return `<div class="card">
      <div class="flex justify-between items-center mb-2">
        <div>
          <div style="font-weight:700;font-size:15px">${esc(p.platform)}</div>
          <div class="text-sm text-muted">@${esc(p.username)}</div>
        </div>
        <button class="btn btn-danger btn-sm btn-icon" onclick="removePlatform(${i})">✕</button>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Followers</label><input class="input" type="text" value="${esc(p.followers||'')}" placeholder="10000" onchange="state.platforms[${i}].followers=this.value;save('platforms')"></div>
        <div class="form-group"><label>Goal</label><input class="input" type="text" value="${esc(p.goal||'')}" placeholder="50000" onchange="state.platforms[${i}].goal=this.value;save('platforms')"></div>
        <div class="form-group"><label>Monthly Earnings ($)</label><input class="input" type="text" value="${esc(p.earnings||'')}" placeholder="0" onchange="state.platforms[${i}].earnings=this.value;save('platforms')"></div>
      </div>
      ${goal?`<div class="progress-wrap"><div class="progress-fill progress-blue" style="width:${pct}%"></div></div>
      <div class="text-sm text-muted mt-1">${pct}% to follower goal</div>`:''}
      <label style="font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:8px">
        <input type="checkbox" ${p.monetized?'checked':''} onchange="state.platforms[${i}].monetized=this.checked;save('platforms')">
        Monetization enabled
      </label>
    </div>`;
  }).join('');
  return `<div class="flex justify-between items-center mb-3">
    <h2 style="font-family:var(--font-heading)">Platforms</h2>
    <button class="btn btn-primary" onclick="showAddPlatformForm()">+ Add Platform</button>
  </div>
  <div id="add-plat-form" style="display:none" class="card mb-3">
    <div class="form-row">
      <div class="form-group"><label>Platform</label><input class="input" type="text" id="plat-name" placeholder="Instagram, TikTok, YouTube…"></div>
      <div class="form-group"><label>Username</label><input class="input" type="text" id="plat-user" placeholder="@yourhandle"></div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="addPlatform()">Add</button>
  </div>
  <div class="grid-3">${cards||'<div class="card"><p class="text-muted">No platforms yet.</p></div>'}</div>`;
}

function showAddPlatformForm() {
  const el = document.getElementById('add-plat-form');
  if (el) el.style.display = el.style.display==='none'?'block':'none';
}

function addPlatform() {
  const platform = document.getElementById('plat-name').value.trim();
  const username = document.getElementById('plat-user').value.trim();
  if (!platform) return;
  if (!Array.isArray(state.platforms)) state.platforms = [];
  state.platforms.push({id:uid(),platform,username,followers:'',goal:'',earnings:'',monetized:false});
  save('platforms');
  setSocialTab('platforms');
}

function removePlatform(i) {
  state.platforms.splice(i,1);
  save('platforms');
  setSocialTab('platforms');
}

function renderContentCal() {
  const items = state.contentCalendar || [];
  const view = currentTabs.contentView || 'list';
  const viewBtns = ['List','Week','Month'].map(v=>`<button class="btn btn-sm ${view===v.toLowerCase()?'btn-primary':'btn-ghost'}" onclick="currentTabs.contentView='${v.toLowerCase()}';setSocialTab('contentcalendar')">${v}</button>`).join('');
  const statusColors = {Idea:'badge-gray',Drafted:'badge-yellow',Scheduled:'badge-blue',Published:'badge-green'};
  let viewHtml = '';
  if (view==='list') {
    const sorted = [...items].sort((a,b)=>a.date.localeCompare(b.date));
    const rows = sorted.map((item,_i)=>{
      const realIdx = items.indexOf(item);
      return `<tr>
        <td>${esc(item.date)}</td>
        <td>${esc(item.platform)}</td>
        <td>${esc(item.title)}</td>
        <td><span class="badge ${statusColors[item.status]||'badge-gray'}">${esc(item.status)}</span></td>
        <td><button class="btn btn-danger btn-sm btn-icon" onclick="removeContent(${realIdx})">✕</button></td>
      </tr>`;
    }).join('');
    viewHtml = `<div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Platform</th><th>Title</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="text-muted">No content planned.</td></tr>'}</tbody>
    </table></div>`;
  } else if (view==='week') {
    const cells = DAYS.map((d,i)=>{
      const dayItems = items.filter(it => {
        if (!it.date) return false;
        const nd = new Date(it.date+'T00:00:00'); return nd.getDay() === (i===6?0:i+1);
      });
      return `<div>
        <div style="font-weight:700;font-size:11px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;text-align:center">${DAY_LABELS[i]}</div>
        ${dayItems.map(it=>`<div style="font-size:11px;padding:4px 6px;border-radius:5px;margin-bottom:3px;background:var(--accent-light);color:var(--accent)">${esc(it.title)}</div>`).join('')}
      </div>`;
    }).join('');
    viewHtml = `<div class="grid-7">${cells}</div>`;
  } else {
    viewHtml = '<p class="text-muted text-sm">Month view: Use List view to see all planned content by date.</p>';
  }
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin-bottom:0">Content Calendar</div>
      <div class="flex gap-2">${viewBtns}</div>
    </div>
    <div class="form-row mb-3">
      <div class="form-group"><label>Title</label><input class="input" type="text" id="cont-title" placeholder="Post idea…"></div>
      <div class="form-group"><label>Platform</label><input class="input" type="text" id="cont-plat" placeholder="Instagram, YouTube…"></div>
      <div class="form-group"><label>Date</label><input class="input" type="text" id="cont-date" placeholder="YYYY-MM-DD"></div>
      <div class="form-group"><label>Status</label>
        <select class="select" id="cont-status"><option>Idea</option><option>Drafted</option><option>Scheduled</option><option>Published</option></select>
      </div>
    </div>
    <button class="btn btn-primary btn-sm mb-3" onclick="addContent()">+ Add Content</button>
    ${viewHtml}
  </div>`;
}

function addContent() {
  const title = document.getElementById('cont-title').value.trim();
  const platform = document.getElementById('cont-plat').value.trim();
  const date = document.getElementById('cont-date').value.trim();
  const status = document.getElementById('cont-status').value;
  if (!title) return;
  if (!Array.isArray(state.contentCalendar)) state.contentCalendar = [];
  state.contentCalendar.push({id:uid(),title,platform,date,status});
  save('contentCalendar');
  setSocialTab('contentcalendar');
}

function removeContent(i) {
  state.contentCalendar.splice(i,1);
  save('contentCalendar');
  setSocialTab('contentcalendar');
}

function renderBrandDeals() {
  const deals = state.brandDeals || [];
  const rows = deals.map((d,i)=>`<div class="card mb-2" style="padding:14px">
    <div class="flex justify-between items-center mb-2">
      <input class="input flex-1 mr-2" type="text" value="${esc(d.brand||'')}" placeholder="Brand name"
        onchange="state.brandDeals[${i}].brand=this.value;save('brandDeals')" style="font-weight:600">
      <select class="select" style="width:140px;padding:4px 8px;font-size:12px" onchange="state.brandDeals[${i}].status=this.value;save('brandDeals')">
        ${['Negotiating','Confirmed','Completed'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <button class="btn btn-danger btn-sm btn-icon ml-2" onclick="removeBrandDeal(${i})">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Platform</label><input class="input" type="text" value="${esc(d.platform||'')}" placeholder="Instagram" onchange="state.brandDeals[${i}].platform=this.value;save('brandDeals')"></div>
      <div class="form-group"><label>Payment ($)</label><input class="input" type="text" value="${esc(d.payment||'')}" placeholder="500" onchange="state.brandDeals[${i}].payment=this.value;save('brandDeals')"></div>
      <div class="form-group"><label>Due Date</label><input class="input" type="text" value="${esc(d.dueDate||'')}" placeholder="YYYY-MM-DD" onchange="state.brandDeals[${i}].dueDate=this.value;save('brandDeals')"></div>
    </div>
    <div class="form-group"><label>Deliverables</label>
      <textarea class="textarea w-full" style="min-height:50px" placeholder="2 Instagram posts, 1 story…"
        onchange="state.brandDeals[${i}].deliverables=this.value;save('brandDeals')">${esc(d.deliverables||'')}</textarea>
    </div>
  </div>`).join('');
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin-bottom:0">Brand Deals</div>
      <button class="btn btn-primary btn-sm" onclick="addBrandDeal()">+ Add Deal</button>
    </div>
    ${rows || '<p class="text-muted text-sm">No brand deals yet.</p>'}
  </div>`;
}

function addBrandDeal() {
  if (!Array.isArray(state.brandDeals)) state.brandDeals = [];
  state.brandDeals.push({id:uid(),brand:'',platform:'',payment:'',dueDate:'',deliverables:'',status:'Negotiating'});
  save('brandDeals');
  setSocialTab('branddeals');
}

function removeBrandDeal(i) {
  state.brandDeals.splice(i,1);
  save('brandDeals');
  setSocialTab('branddeals');
}

function initSocial() {
  if (!currentTabs.social) currentTabs.social = 'platforms';
  if (!currentTabs.contentView) currentTabs.contentView = 'list';
}

/* ===========================
   NOTES & JOURNAL
=========================== */
function renderNotes() {
  const tab = currentTabs.notes || 'journal';
  const tbar = ['Journal','Quick Notes','Ideas'].map(t=>{
    const k = t.toLowerCase().replace(' ','');
    return `<button class="tab-btn ${tab===k?'active':''}" onclick="setNotesTab('${k}')">${t}</button>`;
  }).join('');
  return `<div class="section-header"><h1>Notes & Journal</h1></div>
  <div class="tab-bar">${tbar}</div>
  <div id="notes-body">${renderNotesTab(tab)}</div>`;
}

function setNotesTab(tab) {
  currentTabs.notes = tab;
  const el = document.getElementById('notes-body');
  if (el) el.innerHTML = renderNotesTab(tab);
  document.querySelectorAll('#app-content .tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().replace(' ','')=== tab));
}

function renderNotesTab(tab) {
  if (tab==='journal') return renderJournal();
  if (tab==='quicknotes') return renderQuickNotes();
  if (tab==='ideas') return renderIdeas();
  return '';
}

function renderJournal() {
  const entries = state.journalEntries || [];
  const search = currentTabs.journalSearch || '';
  const filtered = search
    ? entries.filter(e=>(e.body+e.tag+e.mood+e.date).toLowerCase().includes(search.toLowerCase()))
    : entries;
  const entryHtml = [...filtered].reverse().map((e,i)=>{
    const realIdx = entries.indexOf(e);
    return `<div class="journal-entry">
      <div class="journal-entry-header" onclick="toggleJournalEntry(this)">
        <span style="font-size:20px">${e.mood||'📓'}</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:13.5px">${esc(e.date)}</div>
          <div class="text-sm text-muted">${e.tag?'#'+esc(e.tag):''} ${esc((e.body||'').slice(0,60))}${(e.body||'').length>60?'…':''}</div>
        </div>
        <button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();removeJournalEntry(${realIdx})">✕</button>
      </div>
      <div class="journal-entry-body">${esc(e.body).replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('');
  return `<div class="grid-2">
    <div class="card">
      <div class="card-title">New Entry</div>
      <div class="form-row">
        <div class="form-group"><label>Date</label><input class="input" type="text" id="j-date" placeholder="YYYY-MM-DD" value="${todayStr()}"></div>
        <div class="form-group"><label>Mood</label>
          <div class="mood-picker" style="margin:0">${MOODS.map(m=>`<button class="mood-btn" onclick="selectJournalMood('${m}',this)">${m}</button>`).join('')}</div>
        </div>
        <div class="form-group"><label>Tag</label><input class="input" type="text" id="j-tag" placeholder="gratitude, reflection…"></div>
      </div>
      <textarea class="textarea w-full mb-3" id="j-body" style="min-height:180px" placeholder="Write your thoughts…"></textarea>
      <button class="btn btn-primary" onclick="saveJournalEntry()">Save Entry</button>
    </div>
    <div class="card">
      <div class="flex justify-between items-center mb-3">
        <div class="card-title" style="margin-bottom:0">Past Entries (${entries.length})</div>
      </div>
      <input class="input w-full mb-3" type="text" placeholder="Search entries…" value="${esc(search)}"
        oninput="currentTabs.journalSearch=this.value;setNotesTab('journal')">
      ${entryHtml || '<p class="text-muted text-sm">No entries yet. Start journaling!</p>'}
    </div>
  </div>`;
}

let journalMood = '';
function selectJournalMood(m, btn) {
  journalMood = m;
  document.querySelectorAll('#notes-body .mood-picker .mood-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function saveJournalEntry() {
  const date = document.getElementById('j-date').value.trim();
  const body = document.getElementById('j-body').value.trim();
  const tag = document.getElementById('j-tag').value.trim();
  if (!body) return;
  if (!Array.isArray(state.journalEntries)) state.journalEntries = [];
  state.journalEntries.push({id:uid(),date,mood:journalMood||'📓',tag,body});
  journalMood = '';
  save('journalEntries');
  setNotesTab('journal');
}

function removeJournalEntry(i) {
  state.journalEntries.splice(i,1);
  save('journalEntries');
  setNotesTab('journal');
}

function toggleJournalEntry(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

function renderQuickNotes() {
  return `<div class="card">
    <div class="card-title">Quick Notes</div>
    <textarea class="textarea w-full" style="min-height:400px;font-size:14px;line-height:1.7"
      placeholder="Your quick notes, reminders, ideas…"
      onchange="state.quickNotes=this.value;save('quickNotes')">${esc(state.quickNotes||'')}</textarea>
  </div>`;
}

function renderIdeas() {
  const ideas = state.ideas || [];
  const cats = ['All','Business','Creative','Personal','Other'];
  const filter = currentTabs.ideaFilter || 'All';
  const filtered = filter==='All' ? ideas : ideas.filter(i=>i.category===filter);
  const catBtns = cats.map(c=>`<button class="btn btn-sm ${filter===c?'btn-primary':'btn-ghost'}" onclick="currentTabs.ideaFilter='${c}';setNotesTab('ideas')">${c}</button>`).join('');
  const cards = [...filtered].reverse().map((idea,_i)=>{
    const realIdx = ideas.indexOf(idea);
    return `<div class="card" style="padding:14px;border:${idea.starred?'2px solid var(--accent)':'1.5px solid var(--border)'}">
      <div class="flex justify-between items-center mb-1">
        <span class="badge badge-gray">${esc(idea.category)}</span>
        <div class="flex gap-1">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="toggleIdeaStar(${realIdx})">${idea.starred?'⭐':'☆'}</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="removeIdea(${realIdx})">✕</button>
        </div>
      </div>
      <div style="font-weight:600;font-size:14px;margin-bottom:4px">${esc(idea.title)}</div>
      <div style="font-size:13px;color:var(--text-muted)">${esc(idea.body)}</div>
    </div>`;
  }).join('');
  return `<div class="card mb-3">
    <div class="card-title">Capture an Idea</div>
    <div class="form-row">
      <div class="form-group"><label>Title</label><input class="input" type="text" id="idea-title" placeholder="Idea title"></div>
      <div class="form-group"><label>Category</label>
        <select class="select" id="idea-cat"><option>Business</option><option>Creative</option><option>Personal</option><option>Other</option></select>
      </div>
    </div>
    <textarea class="textarea w-full mb-2" id="idea-body" placeholder="Describe your idea…" rows="3"></textarea>
    <button class="btn btn-primary btn-sm" onclick="addIdea()">Save Idea</button>
  </div>
  <div class="flex gap-2 mb-3">${catBtns}</div>
  <div class="grid-3">${cards||'<div class="card"><p class="text-muted">No ideas yet. Capture your first one!</p></div>'}</div>`;
}

function addIdea() {
  const title = document.getElementById('idea-title').value.trim();
  const body = document.getElementById('idea-body').value.trim();
  const category = document.getElementById('idea-cat').value;
  if (!title) return;
  if (!Array.isArray(state.ideas)) state.ideas = [];
  state.ideas.push({id:uid(),title,body,category,starred:false});
  save('ideas');
  setNotesTab('ideas');
}

function removeIdea(i) {
  state.ideas.splice(i,1);
  save('ideas');
  setNotesTab('ideas');
}

function toggleIdeaStar(i) {
  state.ideas[i].starred = !state.ideas[i].starred;
  save('ideas');
  setNotesTab('ideas');
}

function initNotes() {
  if (!currentTabs.notes) currentTabs.notes = 'journal';
}

/* ===========================
   SETTINGS
=========================== */
function renderSettings() {
  const themes = [
    {id:'blackwhite',label:'Black & White',bar:'#1a1a1a',stripe:'#1a1a1a',double:true},
    {id:'blush',label:'Soft Blush',bar:'#c4768a',stripe:'linear-gradient(135deg,#EFCED7,#e8b5c0)'},
    {id:'blue',label:'Serene Blue',bar:'#79A3C3',stripe:'linear-gradient(135deg,#79A3C3,#b0cede)'}
  ];
  const themePreviews = themes.map(t=>`<div class="theme-option ${state.theme===t.id?'selected':''}" onclick="changeTheme('${t.id}')">
    <div class="theme-preview">
      <div class="theme-preview-bar" style="background:${t.bar}"></div>
      <div class="theme-preview-main">
        <div style="height:4px;border-radius:2px;background:${t.stripe};margin-bottom:4px"></div>
        <div class="theme-preview-line"></div>
        <div class="theme-preview-line" style="width:60%"></div>
      </div>
    </div>
    <p>${t.label}</p>
  </div>`).join('');
  return `
  <div class="section-header"><h1>Settings</h1></div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title">Profile</div>
      <div class="form-group"><label>Your Name</label>
        <input class="input" type="text" value="${esc(state.userName||'')}" placeholder="Your name"
          onchange="state.userName=this.value;save('userName');updateSidebarUser()">
      </div>
      <div class="form-group"><label>Cover Photo</label>
        <button class="btn btn-secondary" onclick="document.getElementById('settings-cover').click()">
          ${state.coverPhoto ? '✏️ Change Cover Photo' : '📷 Upload Cover Photo'}
        </button>
        <input type="file" id="settings-cover" accept="image/*" style="display:none" onchange="handleCoverUpload(this)">
        ${state.coverPhoto ? `<div class="mt-2"><img src="${state.coverPhoto}" style="height:60px;border-radius:8px;object-fit:cover"></div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Account</div>
      <div class="form-group"><label>Email</label>
        <input class="input" type="email" value="${esc(currentUser ? currentUser.email : '')}" readonly style="background:var(--bg);cursor:default">
      </div>
      <div class="flex flex-col gap-3 mt-2">
        <button class="btn btn-secondary" onclick="sendPasswordReset()">🔑 Send Password Reset Email</button>
        <button class="btn btn-danger" onclick="doLogout()">🚪 Sign Out</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Theme</div>
    <div class="theme-options">${themePreviews}</div>
  </div>
  <div class="card">
    <div class="card-title">Data</div>
    <div class="flex gap-3">
      <button class="btn btn-secondary" onclick="exportData()">⬇️ Export All Data</button>
      <button class="btn btn-danger" onclick="clearAllData()">🗑️ Clear All Data</button>
    </div>
  </div>`;
}

function changeTheme(t) {
  applyTheme(t);
  save('theme');
  renderSection('settings');
}

function clearAllData() {
  if (!confirm('This will permanently delete ALL your planner data. Are you sure?')) return;
  if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
  // Delete all rows from Supabase
  if (currentUser) {
    sb.from('user_data').delete().eq('user_id', currentUser.id).then(()=>{
      // Reset state (keep theme and user info)
      const savedTheme = state.theme;
      const savedName = state.userName;
      Object.keys(state).forEach(k=>{ if(k!=='theme'&&k!=='userName'&&k!=='coverPhoto') state[k]=Array.isArray(state[k])?[]:typeof state[k]==='object'?{}:''; });
      state.theme = savedTheme;
      state.userName = savedName;
      initHabits();
      alert('All data cleared.');
      renderSection('settings');
    });
  }
}

function initSettings() {}

/* ===========================
   APP INIT
=========================== */
// Keyboard shortcut: Enter on auth fields
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginPass = document.getElementById('login-password');
    const signupPass = document.getElementById('signup-password');
    if (document.activeElement === loginPass) doLogin();
    if (document.activeElement === signupPass) doSignup();
  }
});
</script>
